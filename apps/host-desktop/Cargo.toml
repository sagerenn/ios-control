[package]
name = "host-desktop"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
eframe = "0.31"
egui = "0.31"
ios-control-contracts = { path = "../../crates/contracts" }
ios-control-frame-transport = { path = "../../crates/frame-transport" }
ios-control-plugin-protocol = { path = "../../crates/plugin-protocol" }
ios-control-plugin-runtime = { path = "../../crates/plugin-runtime" }
ios-control-session-orchestrator = { path = "../../crates/session-orchestrator" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"
