[package]
name = "ble-helper"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "4.4.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
  "Devices_Bluetooth",
  "Devices_Bluetooth_GenericAttributeProfile",
  "Foundation",
  "Storage_Streams",
] }
