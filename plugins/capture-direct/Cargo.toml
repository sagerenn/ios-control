[package]
name = "plugin-capture-direct"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
async-trait = "0.1"
image = "0.25"
ios-control-contracts = { path = "../../crates/contracts" }
ios-control-frame-transport = { path = "../../crates/frame-transport" }
ios-control-plugin-protocol = { path = "../../crates/plugin-protocol" }
mdns-sd = { version = "0.20", default-features = false }
plist = "=1.8.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
