name: ci-release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test-native-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux UI dependencies
        run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev
      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""
      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-linux
          key: cargo-test
      - name: Run workspace tests
        run: cargo test --workspace

  test-native-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""
      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-windows
          key: cargo-test
      - name: Run workspace tests
        run: cargo test --workspace

  build-release-matrix:
    if: github.event_name == 'push'
    needs: [test-native-linux, test-native-windows]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
            builder: cargo
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive_ext: tar.gz
            builder: cross
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
            builder: cargo
          - runner: windows-latest
            target: aarch64-pc-windows-msvc
            archive_ext: zip
            builder: cargo
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux UI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev
      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""
          target: ${{ matrix.target }}
      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
          key: release-build
      - name: Install cross
        if: matrix.builder == 'cross'
        run: cargo install cross --git https://github.com/cross-rs/cross --rev f86fd03bb70b4c6802847c18087e21391498b0b4 --locked
      - name: Capture build metadata
        id: build-metadata
        shell: bash
        run: echo "timestamp=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - name: Build release binaries with cargo
        if: matrix.builder == 'cargo'
        shell: bash
        run: >
          cargo build --release --target "${{ matrix.target }}"
          --package host-desktop
          --package plugin-control-ble
          --package plugin-capture-window
          --package plugin-capture-direct
          --package plugin-grounding-core
          --package plugin-mock-device
      - name: Build release binaries with cross
        if: matrix.builder == 'cross'
        shell: bash
        run: >
          cross build --release --target "${{ matrix.target }}"
          --package host-desktop
          --package plugin-control-ble
          --package plugin-capture-window
          --package plugin-capture-direct
          --package plugin-grounding-core
          --package plugin-mock-device
      - name: Package release archives
        shell: bash
        run: >
          python scripts/package_release.py
          --target ${{ matrix.target }}
          --bin-dir target/${{ matrix.target }}/release
          --out-dir dist/${{ matrix.target }}
          --sha ${{ github.sha }}
          --ref-name ${{ github.ref_name }}
          --run-number ${{ github.run_number }}
          --timestamp ${{ steps.build-metadata.outputs.timestamp }}
      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: bundle-${{ matrix.target }}
          path: dist/${{ matrix.target }}/ios-control-${{ matrix.target }}.${{ matrix.archive_ext }}
      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: plugins-${{ matrix.target }}
          path: dist/${{ matrix.target }}/ios-control-plugins-${{ matrix.target }}.${{ matrix.archive_ext }}

  publish-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-release-matrix]
    concurrency:
      group: rolling-main
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
      - name: Flatten artifacts
        shell: bash
        run: |
          mkdir -p upload
          find artifacts -type f -print0 | xargs -0 -I {} cp "{}" upload/
      - name: Delete previous rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          release_output=""
          release_status=0
          release_output=$(gh api repos/${{ github.repository }}/releases/tags/rolling-main 2>&1) || release_status=$?
          if [ $release_status -eq 0 ]; then
            gh release delete rolling-main --yes --cleanup-tag
          else
            if printf "%s" "$release_output" | grep -q "HTTP 404"; then
              :
            else
              printf "%s\n" "$release_output" >&2
              exit $release_status
            fi
          fi

          tag_output=""
          tag_status=0
          tag_output=$(gh api repos/${{ github.repository }}/git/refs/tags/rolling-main 2>&1) || tag_status=$?
          if [ $tag_status -eq 0 ]; then
            gh api -X DELETE repos/${{ github.repository }}/git/refs/tags/rolling-main
          else
            if printf "%s" "$tag_output" | grep -q "HTTP 404"; then
              :
            else
              printf "%s\n" "$tag_output" >&2
              exit $tag_status
            fi
          fi
      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rolling-main
          name: rolling-main
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: upload/*
          fail_on_unmatched_files: true
          overwrite_files: true

  publish-tag:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build-release-matrix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
      - name: Flatten artifacts
        shell: bash
        run: |
          mkdir -p upload
          find artifacts -type f -print0 | xargs -0 -I {} cp "{}" upload/
      - name: Publish versioned release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: upload/*
          fail_on_unmatched_files: true
          overwrite_files: true
