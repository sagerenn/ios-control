name: ci-release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

env:
  UXPLAY_REF: v1.73.6
  GSTREAMER_VERSION: "1.26.3"

jobs:
  test-native-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux UI dependencies
        run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev
      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""
      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-linux
          key: cargo-test
      - name: Run workspace tests
        run: cargo test --workspace
      - name: Run host runtime smoke test
        run: cargo test -p host-desktop runtime_start_session_returns_workspace_snapshot -- --exact
      - name: Run Python CI and docs tests
        run: python3 -m unittest discover -s tests/ci -p 'test_*.py' -v

  test-native-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""
      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-windows
          key: cargo-test
      - name: Run workspace tests
        run: cargo test --workspace

  build-direct-runtime-matrix:
    if: github.event_name == 'push'
    needs: [test-native-linux, test-native-windows]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            uxplay_builder: native
            gstreamer_source: source
            beacon_helper_relpath: ../../../helpers/direct-beacon
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            uxplay_builder: cross
            gstreamer_source: source
            beacon_helper_relpath: ../../../helpers/direct-beacon
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            uxplay_builder: msys2
            gstreamer_source: download
            msystem: UCRT64
            msys_packages: >-
              git
              base-devel
              mingw-w64-ucrt-x86_64-toolchain
              mingw-w64-ucrt-x86_64-cmake
              mingw-w64-ucrt-x86_64-ninja
              mingw-w64-ucrt-x86_64-meson
              mingw-w64-ucrt-x86_64-python
              mingw-w64-ucrt-x86_64-pkgconf
              unzip
            beacon_helper_relpath: ../../../helpers/direct-beacon.exe
          - runner: windows-latest
            target: aarch64-pc-windows-msvc
            uxplay_builder: msys2
            gstreamer_source: source
            msystem: CLANGARM64
            msys_packages: >-
              git
              base-devel
              mingw-w64-clang-aarch64-toolchain
              mingw-w64-clang-aarch64-cmake
              mingw-w64-clang-aarch64-ninja
              mingw-w64-clang-aarch64-meson
              mingw-w64-clang-aarch64-python
              mingw-w64-clang-aarch64-pkgconf
              unzip
            beacon_helper_relpath: ../../../helpers/direct-beacon.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Configure Ubuntu multiarch package sources
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture arm64
          sudo python3 - <<'PY'
          from pathlib import Path

          ubuntu_source_tokens = (
              "apt-mirrors.txt",
              "archive.ubuntu.com/ubuntu",
              "azure.archive.ubuntu.com/ubuntu",
              "security.ubuntu.com/ubuntu",
          )

          for source_path in Path("/etc/apt/sources.list.d").glob("*.sources"):
              text = source_path.read_text(encoding="utf-8")
              stanzas = [stanza.strip() for stanza in text.split("\n\n") if stanza.strip()]
              updated_stanzas = []
              changed = False
              for stanza in stanzas:
                  lines = stanza.splitlines()
                  uris = [line.partition(":")[2].strip() for line in lines if line.startswith("URIs:")]
                  if not any(token in uri for uri in uris for token in ubuntu_source_tokens):
                      updated_stanzas.append(stanza)
                      continue
                  if any(line.startswith("Architectures:") for line in lines):
                      lines = [
                          "Architectures: amd64" if line.startswith("Architectures:") else line
                          for line in lines
                      ]
                  else:
                      lines.append("Architectures: amd64")
                  updated_stanzas.append("\n".join(lines))
                  changed = True
              if changed:
                  source_path.write_text("\n\n".join(updated_stanzas) + "\n", encoding="utf-8")
          PY
          sudo tee /etc/apt/sources.list.d/ubuntu-arm64.sources >/dev/null <<'EOF'
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports/
          Suites: noble noble-updates noble-backports noble-security
          Components: main restricted universe multiverse
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
      - name: Install Linux direct runtime build dependencies
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          build-essential
          cmake
          ninja-build
          meson
          pkg-config
          python3
          python3-pip
          curl
          unzip
          git
          libdbus-1-dev
          libssl-dev
          libplist-dev
          libasound2-dev
          libavahi-compat-libdnssd-dev
          libdbus-1-dev:arm64
          libssl-dev:arm64
          libplist-dev:arm64
          libasound2-dev:arm64
          libavahi-compat-libdnssd-dev:arm64
          gcc-aarch64-linux-gnu
          g++-aarch64-linux-gnu
      - name: Setup MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: ${{ matrix.msys_packages }}
      - name: Restore direct runtime cache
        uses: actions/cache@v4
        with:
          path: .runtime-cache/${{ matrix.target }}
          key: direct-runtime-${{ matrix.target }}-${{ env.UXPLAY_REF }}-${{ env.GSTREAMER_VERSION }}
      - name: Build direct runtime on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: >
          bash scripts/ci/build_direct_runtime_linux.sh
          "${{ matrix.target }}"
          "${{ matrix.uxplay_builder }}"
          "${{ matrix.gstreamer_source }}"
          runtime
          "${{ matrix.beacon_helper_relpath }}"
      - name: Build direct runtime on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          ./scripts/ci/build_direct_runtime_windows.ps1
          -Target "${{ matrix.target }}"
          -GstreamerSource "${{ matrix.gstreamer_source }}"
          -OutDir runtime
          -BeaconHelperRelpath "${{ matrix.beacon_helper_relpath }}"
      - name: Upload direct runtime artifact
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: direct-runtime-${{ matrix.target }}
          path: runtime

  build-release-matrix:
    if: github.event_name == 'push'
    needs: [test-native-linux, test-native-windows, build-direct-runtime-matrix]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
            builder: cargo
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive_ext: tar.gz
            builder: cross
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
            builder: cargo
          - runner: windows-latest
            target: aarch64-pc-windows-msvc
            archive_ext: zip
            builder: cargo
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux UI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev
      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""
          target: ${{ matrix.target }}
      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
          key: release-build
      - name: Install cross
        if: matrix.builder == 'cross'
        run: cargo install cross --git https://github.com/cross-rs/cross --rev f86fd03bb70b4c6802847c18087e21391498b0b4 --locked
      - name: Capture build metadata
        id: build-metadata
        shell: bash
        run: echo "timestamp=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - name: Build release binaries with cargo
        if: matrix.builder == 'cargo'
        shell: bash
        run: >
          cargo build --release --target "${{ matrix.target }}"
          --package host-desktop
          --package plugin-control-ble
          --package plugin-control-window-bridge
          --package plugin-capture-window
          --package plugin-capture-direct
          --package plugin-grounding-core
          --package plugin-mock-device
          --package ble-helper
          --package direct-beacon
      - name: Build release binaries with cross
        if: matrix.builder == 'cross'
        shell: bash
        run: >
          cross build --release --target "${{ matrix.target }}"
          --package host-desktop
          --package plugin-control-ble
          --package plugin-control-window-bridge
          --package plugin-capture-window
          --package plugin-capture-direct
          --package plugin-grounding-core
          --package plugin-mock-device
          --package ble-helper
          --package direct-beacon
      - name: Download direct runtime artifact
        uses: actions/download-artifact@v5
        with:
          name: direct-runtime-${{ matrix.target }}
          path: runtime
      - name: Package release archives
        shell: bash
        run: >
          python scripts/package_release.py
          --target ${{ matrix.target }}
          --bin-dir target/${{ matrix.target }}/release
          --out-dir dist/${{ matrix.target }}
          --runtime-dir runtime
          --sha ${{ github.sha }}
          --ref-name ${{ github.ref_name }}
          --run-number ${{ github.run_number }}
          --timestamp ${{ steps.build-metadata.outputs.timestamp }}
      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: bundle-${{ matrix.target }}
          path: dist/${{ matrix.target }}/ios-control-${{ matrix.target }}.${{ matrix.archive_ext }}
      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: plugins-${{ matrix.target }}
          path: dist/${{ matrix.target }}/ios-control-plugins-${{ matrix.target }}.${{ matrix.archive_ext }}

  publish-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-release-matrix]
    concurrency:
      group: rolling-main
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
      - name: Flatten artifacts
        shell: bash
        run: |
          mkdir -p upload
          find artifacts -type f -print0 | xargs -0 -I {} cp "{}" upload/
      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="rolling-main"
          notes="Automated rolling release for the latest successful push to main."
          if gh api repos/$GH_REPO/git/refs/tags/$tag >/dev/null 2>&1; then
            gh api --method PATCH repos/$GH_REPO/git/refs/tags/$tag -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api --method POST repos/$GH_REPO/git/refs -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null
          fi
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$GH_REPO" --title "$tag" --notes "$notes" --prerelease
            gh release upload "$tag" upload/* --clobber --repo "$GH_REPO"
          else
            gh release create "$tag" upload/* --repo "$GH_REPO" --target "$GITHUB_SHA" --title "$tag" --notes "$notes" --prerelease
          fi

  publish-tag:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build-release-matrix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
      - name: Flatten artifacts
        shell: bash
        run: |
          mkdir -p upload
          find artifacts -type f -print0 | xargs -0 -I {} cp "{}" upload/
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$tag" upload/* --clobber --repo "$GH_REPO"
          else
            gh release create "$tag" upload/* --repo "$GH_REPO" --verify-tag --title "$tag" --generate-notes
          fi
